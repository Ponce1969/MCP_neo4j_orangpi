[project]
name = "mcp-oranpi"
version = "0.1.0"
description = "Secure MCP server for OrangePi infrastructure auditing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0.0",
    "asyncssh>=2.17.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "mypy>=1.11",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oranpi"]

[project.scripts]
mcp-oranpi = "mcp_oranpi.server:main"

[tool.mypy]
strict = true
packages = ["mcp_oranpi"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "SIM", "T201"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108", "E501"]  # assert, 0.0.0.0, /tmp, long lines in tests are expected
"scripts/**" = ["T201"]  # print is expected in CLI scripts
"src/mcp_oranpi/presentation/**" = ["E501"]  # tool descriptions are intentionally long

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pytest-asyncio]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
