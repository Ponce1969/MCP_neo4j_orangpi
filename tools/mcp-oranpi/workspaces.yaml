# Workspace Registry — MCP OranPi
#
# Maps logical workspace identifiers to their paths on the OrangePi.
# Paths are on the REMOTE host (gonpatri), not the local machine.
# Each workspace path points to the project root (where .git or
# docker-compose.yml lives) so docker compose commands work correctly.
# The agent NEVER sees raw filesystem paths — only logical identifiers.

