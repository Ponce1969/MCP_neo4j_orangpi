# SDD Configuration — agentic-book-graph (mcp_neo4j_orangpi)
# Auto-generated by sdd-init. Edit freely; init will not overwrite existing config.

project:
  name: mcp_neo4j_orangpi
  display_name: "book-graph-rag"
  root: "C:/Users/cerra/codigo/agentic-book-graph"
  description: "Knowledge-graph RAG indexer for 'Agentic Architectural Patterns for Building Multi-Agent Systems'"

stack:
  language: python
  version: "3.12+"
  package_manager: uv
  build_system: hatchling
  framework: none (pure hexagonal architecture)
  key_dependencies:
    - pydantic>=2.7
    - pydantic-settings>=2.4
    - instructor>=1.4
    - neo4j>=5.23
    - pymupdf>=1.24
    - tenacity>=8.5
    - click>=8.1
    - mcp>=1.27,<2

architecture:
  pattern: hexagonal (ports & adapters)
  src_layout: src/book_graph_rag/{domain,ports,infrastructure,application}
  enforcement: scripts/validate_architecture.py
  rules:
    - domain/ and application/ MUST NOT import infrastructure
    - domain/ and application/ MUST NOT import external libs except pydantic
    - ports/ defines abstract interfaces; infrastructure/ implements them

testing:
  framework: pytest
  test_command: "uv run pytest"
  testpaths: ["tests"]
  markers:
    - neo4j_integration: tests that require a live Neo4j container
  features:
    - pytest-asyncio (asyncio_mode=auto)
    - hypothesis (property-based tests in tests/unit/)
    - testcontainers[neo4j] (integration tests)
    - ragas (evaluation/quality tests)
  total_tests: 575
  layout:
    - tests/ (top-level: domain, ports, adapters, CLI, use-case tests)
    - tests/unit/ (unit isolation: clustering, properties, communities)
    - tests/integration/ (Neo4j integration: community adapter, query explain)

quality_gates:
  - name: ruff
    command: "uv run ruff check ."
    config: "select: E,F,I,N,UP,B,A,C4,PT,RET,SIM; line-length=100"
  - name: mypy
    command: "uv run mypy ."
    config: "strict=true, disallow_untyped_defs=true, disallow_any_unimported=true"
  - name: architecture
    command: "uv run python scripts/validate_architecture.py"
    config: "AST-based import guard for domain/ and application/"

sdd:
  artifact_store: engram
  strict_tdd: true
  strict_tdd_rationale: >
    575 tests exist with pytest, pytest-asyncio, hypothesis, and testcontainers.
    pytest configured with --strict-markers and asyncio_mode=auto.
    Test layout mirrors src architecture (unit/integration separation).
    Project enforces hexagonal architecture with quality gates.
    All conditions for strict TDD are met: fast test runner, good coverage,
    clean test organization, and infrastructure for async/integration testing.

conventions:
  language: Python 3.12+, type hints mandatory (mypy strict)
  style: ruff enforced, 100-char line length
  architecture: hexagonal, validated by AST script
  commits: conventional commits (per persona rules)
  docs: normative specs in docs/spec/ (00-governance through 07 + roadmap)
  deployment: Orange Pi 5 Plus ARM, Neo4j 5.23 Docker on Tailscale (100.106.85.109)

skill_registry:
  path: .atl/skill-registry.md
  exists: true
  relevant_skills:
    - graphrag-architect
    - python-testing-spec
    - codeguard
    - work-unit-commits
